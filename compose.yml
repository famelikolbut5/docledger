services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:3000"
    environment:
      DATABASE_URL: postgres://demo:demo@db:5432/docledger
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: docledger
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d docledger"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  data:
